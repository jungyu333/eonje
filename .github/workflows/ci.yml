name: ci

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/collector/Dockerfile
          tags: eonje-collector:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --help는 settings 없이도 돈다. registry가 모든 job 모듈을 import하므로
      # 의존성(httpx, pyarrow, s3fs, sqlalchemy) 누락은 여기서 잡힌다.
      # job 실행 자체는 DB·S3가 있어야 해서 db job의 테스트가 맡는다.
      - name: smoke test
        run: |
          docker run --rm eonje-collector:ci --help > help.txt
          cat help.txt
          grep -q fetch-delta help.txt
          docker run --rm --entrypoint alembic eonje-collector:ci heads

  db:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Throwaway credentials for a Postgres that lives only for this job.
      # No API key: DB tests load DatabaseSettings only.
      # compose interpolates every service even when only postgres starts, so the
      # Airflow and S3 values must be present too (dummies; those services never run here).
      - name: write .env for ci
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres
          POSTGRES_BIND=127.0.0.1
          EONJE_DB_PASSWORD=ci-eonje
          AIRFLOW_DB_PASSWORD=ci-airflow
          EONJE_S3_ACCESS_KEY=ci-s3-access
          EONJE_S3_SECRET_KEY=ci-s3-secret
          EONJE_DATABASE_URL=postgresql+psycopg://eonje:ci-eonje@127.0.0.1:5432/eonje
          AIRFLOW_ADMIN_PASSWORD=ci-airflow-admin
          AIRFLOW_FERNET_KEY=ci-unused-fernet-key
          AIRFLOW_JWT_SECRET=ci-unused-jwt-secret
          EOF

      # Same compose file and init.sh as the dev PC and node A.
      - run: make up SERVICES=postgres
      - run: make install
      - run: make migrate
      - run: make migration-check
      - run: make test-db

      - name: postgres logs on failure
        if: failure()
        run: docker compose -f infra/compose.node-a.yaml --env-file .env logs postgres
