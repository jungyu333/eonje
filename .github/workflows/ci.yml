name: ci

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  # PR only: a newer push must never cancel a main run halfway through a deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the publish job asks for packages: write itself.
permissions:
  contents: read

# Jobs run only when the files they check changed. A skipped job counts as passed.
# On main, a push that touches anything deployable builds every image (publish needs all
# of them at the new sha) and deploys; a docs- or tests-only push stops after its checks.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      collector: ${{ steps.filter.outputs.collector }}
      airflow: ${{ steps.filter.outputs.airflow }}
      spark: ${{ steps.filter.outputs.spark }}
      db: ${{ steps.filter.outputs.db }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            python:
              - *ci
              - '**/*.py'
              - pyproject.toml
              - uv.lock
              - Makefile
            collector:
              - *ci
              - eonje/**
              - pyproject.toml
              - uv.lock
              - alembic.ini
              - infra/migrations/**
              - docker/tasks/collector/**
            airflow:
              - *ci
              - dags/**
              - docker/airflow/**
            spark:
              - *ci
              - eonje/**
              - pyproject.toml
              - uv.lock
              - docker/tasks/spark/**
            db:
              - *ci
              - eonje/**
              - tests/**
              - infra/**
              - pyproject.toml
              - uv.lock
              - alembic.ini
              - Makefile
            deploy:
              - eonje/**
              - dags/**
              - docker/**
              - infra/**
              - pyproject.toml
              - uv.lock
              - alembic.ini
              - .github/workflows/deploy.yml

  check:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.collector == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/collector/Dockerfile
          tags: eonje-collector:ci
          load: true
          push: false
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector
      # --help는 settings 없이도 돈다. registry가 모든 job 모듈을 import하므로
      # 의존성(httpx, pyarrow, s3fs, sqlalchemy) 누락은 여기서 잡힌다.
      # job 실행 자체는 DB·S3가 있어야 해서 db job의 테스트가 맡는다.
      - name: smoke test
        run: |
          docker run --rm eonje-collector:ci --help > help.txt
          cat help.txt
          grep -q fetch-delta help.txt
          docker run --rm --entrypoint alembic eonje-collector:ci heads

  airflow-image:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.airflow == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/airflow
          file: docker/airflow/Dockerfile
          tags: eonje-airflow:ci
          load: true
          push: false
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      # Import every DAG file inside the Airflow image (no DB, no scheduler) and check
      # the rules in check_dags.py, including the DockerOperator attribute EonjeTask relies on.
      - name: dag integrity
        run: >
          docker run --rm
          -v "$PWD/dags:/opt/airflow/dags:ro"
          -v "$PWD/docker/airflow/check_dags.py:/opt/airflow/check_dags.py:ro"
          eonje-airflow:ci python /opt/airflow/check_dags.py /opt/airflow/dags

  spark-image:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.spark == 'true' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/spark/Dockerfile
          tags: eonje-spark:ci
          load: true
          push: false
          cache-from: type=gha,scope=spark
          cache-to: type=gha,mode=max,scope=spark
      # The eonje CLI (driver) and spark-class (master, worker) run inside the image.
      # Cluster and catalog connectivity is checked after deploy by spark-check.
      - name: smoke test
        run: |
          docker run --rm eonje-spark:ci --help > help.txt
          cat help.txt
          grep -q spark-check help.txt
          out=$(docker run --rm --entrypoint spark-class eonje-spark:ci \
            org.apache.spark.deploy.master.Master --help 2>&1 || true)
          echo "$out"
          grep -q "Usage: Master" <<< "$out"

  db:
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: >-
      !failure() && !cancelled() && needs.changes.outputs.db == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Throwaway credentials for a Postgres that lives only for this job.
      # No API key: DB tests load DatabaseSettings only.
      # compose interpolates every service even when only postgres starts, so the
      # Airflow and S3 values must be present too (dummies; those services never run here).
      - name: write .env for ci
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres
          POSTGRES_BIND=127.0.0.1
          EONJE_DB_PASSWORD=ci-eonje
          AIRFLOW_DB_PASSWORD=ci-airflow
          EONJE_S3_ACCESS_KEY=ci-s3-access
          EONJE_S3_SECRET_KEY=ci-s3-secret
          EONJE_DATABASE_URL=postgresql+psycopg://eonje:ci-eonje@127.0.0.1:5432/eonje
          AIRFLOW_ADMIN_PASSWORD=ci-airflow-admin
          AIRFLOW_FERNET_KEY=ci-unused-fernet-key
          AIRFLOW_JWT_SECRET=ci-unused-jwt-secret
          EOF

      # Same compose file and init.sh as the dev PC and node A.
      - run: make up SERVICES=postgres
      - run: make install
      - run: make migrate
      - run: make migration-check
      - run: make test-db

      - name: postgres logs on failure
        if: failure()
        run: docker compose -f infra/compose.node-a.yaml --env-file .env logs postgres

  # main only: push the images that passed every job above, tagged with the commit sha.
  # Deploys pick an image by sha; :main is a moving convenience tag, never deployed by name.
  publish:
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    needs: [changes, image, airflow-image, spark-image, db]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push eonje-collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/collector/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eonje-collector:${{ github.sha }}
            ${{ env.REGISTRY }}/eonje-collector:main
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          cache-from: type=gha,scope=collector
      - name: push eonje-airflow
        uses: docker/build-push-action@v6
        with:
          context: docker/airflow
          file: docker/airflow/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eonje-airflow:${{ github.sha }}
            ${{ env.REGISTRY }}/eonje-airflow:main
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          cache-from: type=gha,scope=airflow
      - name: push eonje-spark
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/spark/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/eonje-spark:${{ github.sha }}
            ${{ env.REGISTRY }}/eonje-spark:main
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          cache-from: type=gha,scope=spark

  # main only: roll the pushed images out to node A and then move the deploy branch.
  deploy:
    needs: publish
    # Without an if, the default success() also looks at jobs above publish, so a skipped
    # check (no .py change) would skip the deploy even though publish succeeded.
    if: ${{ !failure() && !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
