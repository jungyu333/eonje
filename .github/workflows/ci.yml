name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tasks/collector/Dockerfile
          tags: eonje-collector:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          set +e
          docker run --rm -e EONJE_API_SERVICE_KEY=dummy eonje-collector:ci fetch-delta --run-id ci__smoke
          code=$?
          test "$code" -eq 2
