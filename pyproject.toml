[project]
name = "eonje"
version = "0.1.0"
description = "EV charger occupancy patterns from public charger status history"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.3",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "pyarrow>=16",
  "s3fs>=2024.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eonje"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["eonje"]

[[tool.mypy.overrides]]
module = ["s3fs", "s3fs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]