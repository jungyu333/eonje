name: eonje

x-airflow: &airflow
  image: ${EONJE_IMAGE_REPO:-eonje}-airflow:${EONJE_IMAGE_TAG:-dev}
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"   # 켜기 전엔 스케줄로 안 돎
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    EONJE_IMAGE_REPO: ${EONJE_IMAGE_REPO:-eonje}
    EONJE_IMAGE_TAG: ${EONJE_IMAGE_TAG:-dev}
    EONJE_STATUS_INTERVAL_MIN: ${EONJE_STATUS_INTERVAL_MIN:-10}
    EONJE_COLLECT_TIMEOUT_MIN: ${EONJE_COLLECT_TIMEOUT_MIN:-5}
  volumes:
    - ../dags:/opt/airflow/dags:ro      # 개발용. 운영은 CD PR에서 GitDagBundle로
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

x-spark: &spark
  image: ${EONJE_IMAGE_REPO:-eonje}-spark:${EONJE_IMAGE_TAG:-dev}
  restart: unless-stopped
  entrypoint: [ spark-class ]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      EONJE_DB_PASSWORD: ${EONJE_DB_PASSWORD:?set EONJE_DB_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      EONJE_RAW_BUCKET: ${EONJE_RAW_BUCKET:-eonje-raw}
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_BIND:-127.0.0.1}:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweed:/data
    configs:
      - source: seaweed_s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 20

  spark-master:
    <<: *spark
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8090"            # Airflow api-server(8080)와 겹치지 않게
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "${UI_BIND:-127.0.0.1}:8090:8090"   # ← airflow-api-server와 같은 bind 변수로
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8090" ]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  # executor를 띄우는 노드 데몬. A 단독일 때 코어 2, executor용 메모리 4g (B 추가 전)
  spark-worker:
    <<: *spark
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 4g
      - --webui-port
      - "8091"            # 호스트에 열지 않는다. 상태는 master UI에서 본다
    environment:
      SPARK_DAEMON_MEMORY: 512m
      SPARK_LOCAL_DIRS: /tmp/spark-local     # 셔플·스필
    volumes:
      - spark-work:/tmp   # SPARK_WORKER_DIR(/tmp/spark-work)와 셔플을 RAM이 아닌 디스크에
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 5g         # 데몬 0.5 + executor 최대 4 + 여유

  migrate:
    image: ${EONJE_IMAGE_REPO:-eonje}-collector:${EONJE_IMAGE_TAG:-dev}
    profiles: [ "tools" ]
    entrypoint: [ "alembic", "upgrade", "head" ]
    environment:
      EONJE_DATABASE_URL: postgresql+psycopg://eonje:${EONJE_DB_PASSWORD:?set EONJE_DB_PASSWORD in .env}@postgres:5432/eonje
    depends_on:
      postgres:
        condition: service_healthy

  # Spark 경로 확인 (spark-check 잡): executor 계산 + Iceberg 카탈로그. 쓰기 없음
  # CLI가 run 인자를 요구하므로 run_after는 실행 시각으로 넘긴다 (잡은 쓰지 않음)
  spark-check:
    image: ${EONJE_IMAGE_REPO:-eonje}-spark:${EONJE_IMAGE_TAG:-dev}
    profiles: [ "tools" ]
    env_file: ../.env
    environment:
      EONJE_DATABASE_URL: postgresql+psycopg://eonje:${EONJE_DB_PASSWORD:?set EONJE_DB_PASSWORD in .env}@postgres:5432/eonje
      EONJE_S3_ENDPOINT_URL: http://seaweedfs:8333
      EONJE_SPARK_MASTER: spark://spark-master:7077
    entrypoint: [ "sh", "-c" ]
    command:
      - exec python -m eonje.cli spark-check --run-id spark-check --run-after "$$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_started

  airflow-init:
    <<: *airflow
    restart: "no"
    command: [ "airflow", "db", "migrate" ]

  airflow-api-server:
    <<: *airflow
    # configs 파일은 읽기 전용(0444)인데 Airflow는 이 파일을 쓰기 모드(a+)로 연다.
    # cp는 권한까지 복사해 사본도 읽기 전용이 되므로, install로 쓰기 가능한(0600) 사본을 만든다.
    # install은 기존 파일을 지우고 새로 만들어 재시작에도 안전하다
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /tmp/airflow-passwords.json
    command:
      - bash
      - -c
      - |
        install -m 600 /run/airflow/passwords.json /tmp/airflow-passwords.json
        exec airflow api-server
    configs:
      - source: airflow_passwords
        target: /run/airflow/passwords.json
    ports:
      - "${AIRFLOW_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: [ "scheduler" ]
    env_file: ../.env                     # EONJE_* 설정을 태스크에 넘기기 위해
    environment:
      <<: *airflow-env
      # 컨테이너 네트워크 안 주소로 덮어씀 (.env의 127.0.0.1은 호스트용)
      EONJE_DATABASE_URL: postgresql+psycopg://eonje:${EONJE_DB_PASSWORD}@postgres:5432/eonje
      EONJE_S3_ENDPOINT_URL: http://seaweedfs:8333
      EONJE_SPARK_MASTER: spark://spark-master:7077
    group_add:
      - "${DOCKER_GID:-0}"                # docker.sock 접근
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: [ "dag-processor" ]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

configs:
  pg_init:
    file: ./postgres/init.sh
  seaweed_s3:
    content: |
      {
        "identities": [
          {
            "name": "eonje",
            "credentials": [
              {
                "accessKey": "${EONJE_S3_ACCESS_KEY:?set EONJE_S3_ACCESS_KEY in .env}",
                "secretKey": "${EONJE_S3_SECRET_KEY:?set EONJE_S3_SECRET_KEY in .env}"
              }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }
  airflow_passwords:
    content: |
      {"admin": "${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}"}

volumes:
  pgdata:
  seaweed:
  airflow-logs:
  spark-work:
