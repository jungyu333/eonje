name: eonje

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      EONJE_DB_PASSWORD: ${EONJE_DB_PASSWORD:?set EONJE_DB_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      EONJE_RAW_BUCKET: ${EONJE_RAW_BUCKET:-eonje-raw}
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_BIND:-127.0.0.1}:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweed:/data
    configs:
      - source: seaweed_s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 20

configs:
  pg_init:
    file: ./postgres/init.sh
  seaweed_s3:
    content: |
      {
        "identities": [
          {
            "name": "eonje",
            "credentials": [
              {
                "accessKey": "${EONJE_S3_ACCESS_KEY:?set EONJE_S3_ACCESS_KEY in .env}",
                "secretKey": "${EONJE_S3_SECRET_KEY:?set EONJE_S3_SECRET_KEY in .env}"
              }
            ],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  pgdata:
  seaweed:
